name: Build digest and deploy

on:
  push:
    branches: [main]
  schedule:
    # 08:00 and 20:00 UTC = 05:00 and 17:00 in Buenos Aires
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # On a schedule or a manual run, fetch every source server-side and
      # write a fresh edition. Code pushes reuse the committed one.
      - name: Generate digest
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run digest

      - name: Commit digest
        if: github.event_name != 'push'
        run: |
          git config user.name "techpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/digest.json public/digests
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
          else
            git commit -m "digest: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
